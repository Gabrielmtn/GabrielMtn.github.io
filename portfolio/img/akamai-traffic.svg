<svg viewBox="0 0 658 422" role="img" aria-labelledby="ak-ref-t" xmlns="http://www.w3.org/2000/svg" font-family='"Segoe UI", "Instrument Sans", Inter, system-ui, sans-serif'><title id="ak-ref-t">Akamai Traffic Statistics, last updated August 14, 2019. Totals: 1,538 networks, 3,974 locations, 137 countries, 252,881 servers, 130,287 domains active, 3 global NOCCs, and 101.917 billion hours saved versus the public internet. Peak daily usage: bit rate 82.4 Tbps (3/12/19), request rate 101,597,981 hits per second (7/24/18), bytes delivered 10,762,499 TB (9/13/18), requests delivered 10,275 billion (10/4/18), unique client IPv4 683 million (4/14/18), unique client IPv6 3.12 billion (12/23/18), largest attack 1.3 Tbps (2/28/18). Lifetime: 911,902,103 Tb bits delivered, 2,831,017 billion hits, 52,023,159 live events, 3.325 trillion live streams, 22.3 trillion on-demand streams.</title><rect width="658" height="422" fill="#111111"/><polygon points="0,0 241,0 492,36 0,36" fill="#080808"/><rect width="20" height="22" fill="#84bd3b"/><text x="27" y="21" font-size="11.6" fill="#f2f2f2">Akamai Traffic Statistics</text><image x="604" y="4" width="50" height="30" href="data:image/png;base64,"/><text x="27" y="53" font-size="6.7" fill="#f7942a">Total Networks</text><text x="27" y="81" font-size="16.6" font-weight="300" fill="#f2f2f2">1,538</text><text x="89.5" y="53" font-size="6.7" fill="#f7942a">Total Locations</text><text x="89.5" y="81" font-size="16.6" font-weight="300" fill="#f2f2f2">3,974</text><text x="151.5" y="53" font-size="6.7" fill="#f7942a">Total Countries</text><text x="151.5" y="81" font-size="16.6" font-weight="300" fill="#f2f2f2">137</text><text x="213.5" y="53" font-size="6.7" fill="#f7942a">Total Servers</text><text x="213.5" y="81" font-size="16.6" font-weight="300" fill="#f2f2f2">252,881</text><text x="296.5" y="53" font-size="6.7" fill="#f7942a">Total Domains Active</text><text x="296.5" y="81" font-size="16.6" font-weight="300" fill="#f2f2f2">130,287</text><t